<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>주의사항</title>
<style>
  :root {
    --ink: #1b1f24;
    --sub: #6b7280;
    --line: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #ffffff;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
  }
  .wrap {
    max-width: 660px;
    margin: 0 auto;
    padding: 40px 32px 60px;
  }
  .header-title {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
  }
  .header-title img {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    flex: none;
  }
  .header-title h1 {
    font-size: 20px;
    margin: 0;
  }
  .notice-card {
    background: #f9fafb;
    border-radius: 12px;
    padding: 22px 26px;
    font-size: 12.5px;
    line-height: 1.7;
    color: var(--sub);
  }
  .notice-card ul {
    margin: 0;
    padding-left: 18px;
    list-style: disc;
  }
  .notice-card li {
    margin-bottom: 14px;
    color: var(--ink);
  }
  .notice-card li:last-child {
    margin-bottom: 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header-title">
    <img src="icons/icon48.png" alt="" />
    <h1>주의사항</h1>
  </div>

  <div class="notice-card">
    <ul>
      <li>자동으로 GitHub 저장소에 파일이 커밋되므로, 저장소가 공개(Public)라면 문제 설명·코드·실행 결과가 그대로 공개될 수 있습니다. 민감한 내용이 있다면 비공개(Private) 저장소를 사용하세요.</li>
      <li>이 프로그램은 프로그래머스에서 제공하는 코딩테스트 문제의 내용만 커밋하게 설정되어 있습니다. 그러나 만일의 상황에 대비하여 기업 과제테스트·정식 시험 응시 중에는 사용하지 말아주시기 바랍니다.</li>
      <li>이 확장 프로그램 사용으로 발생하는 어떠한 문제에 대해서도 개발자는 책임을 지지 않습니다.</li>
    </ul>
  </div>
</div>
</body>
</html>
